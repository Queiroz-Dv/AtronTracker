<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Titulo}}</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f1f8; color: #24202b; font-family: Arial, sans-serif; }
    .atron-email { width: 100%; max-width: 640px; margin: 0 auto; background: #ffffff; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
    .atron-email__brand { padding: 24px 32px; background: #4c1d78; color: #ffffff; font-size: 24px; font-weight: 700; }
    .atron-email__content { padding: 32px; line-height: 1.6; }
    .atron-email__content h1 { margin-top: 0; color: #4c1d78; font-size: 24px; }
    .atron-email__content a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #6f2da8; color: #ffffff; font-weight: 700; text-decoration: none; }
    .atron-email__footer { padding: 20px 32px; border-top: 1px solid #ece7f1; color: #6b6472; font-size: 12px; }
  </style>
</head>
<body>
  <table class="atron-email" role="presentation">
    <tr><td class="atron-email__brand">Atron</td></tr>
    <tr><td class="atron-email__content">{{Conteudo}}</td></tr>
    <tr><td class="atron-email__footer">Mensagem automática do Sistema Atron. © {{Ano}}</td></tr>
  </table>
</body>
</html>
