@if (mostrarNavbarInterna) {
  <header class="app-form-topbar">
    <div class="app-form-topbar-inner">
      <button class="app-form-brand" type="button" (click)="abrirTracker()" aria-label="Voltar para Atron Tracker">
        <span class="app-form-brand-symbol">
          <mat-icon>hub</mat-icon>
        </span>
        <span>Atron Platform</span>
      </button>

      <div class="app-form-actions" aria-label="Ações da navegação">
        <button
          class="app-form-action app-form-icon-action"
          type="button"
          [matMenuTriggerFor]="notificacoesMenu"
          [matBadge]="totalNaoLidas"
          [matBadgeHidden]="totalNaoLidas === 0"
          matBadgeColor="warn"
          aria-label="Abrir notificações">
          <mat-icon>notifications</mat-icon>
        </button>

        <button class="app-form-action" type="button" (click)="abrirTracker()">
          <mat-icon>analytics</mat-icon>
        </button>

        <button class="app-form-action app-form-action-danger" type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <mat-menu #notificacoesMenu="matMenu" class="app-notifications-menu">
    <div class="app-notifications-panel" (click)="$event.stopPropagation()">
      <header class="app-notifications-header">
        <strong>Notificações</strong>
        <button mat-button type="button" (click)="abrirCentralNotificacoes()">Ver todas</button>
      </header>

      <div class="app-notifications-list">
        @for (notificacao of notificacoes.slice(0, 5); track notificacao.id) {
          <article class="app-notification-item" [class.app-notification-item-unread]="!notificacao.lida">
            <button class="app-notification-content" type="button" (click)="abrirNotificacao(notificacao)">
              <span class="app-notification-title">{{ notificacao.titulo }}</span>
              <span class="app-notification-message">{{ notificacao.mensagem }}</span>
              <span class="app-notification-date">{{ notificacao.dataCriacao | date:'dd/MM/yyyy HH:mm' }}</span>
            </button>

            <button
              mat-icon-button
              type="button"
              title="Marcar como lida"
              [disabled]="notificacao.lida"
              (click)="marcarNotificacaoComoLida(notificacao)">
              <mat-icon>done</mat-icon>
            </button>
          </article>
        } @empty {
          <div class="app-notifications-empty">
            <mat-icon>notifications_none</mat-icon>
            <span>Nenhuma notificação.</span>
          </div>
        }
      </div>
    </div>
  </mat-menu>
}

<router-outlet></router-outlet>
