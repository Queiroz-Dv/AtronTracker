<main class="list-page">
  <section class="list-panel" aria-labelledby="departamentos-title">
    <header class="list-header">
      <div>
        <h1 id="departamentos-title">Departamentos</h1>
      </div>

      <div class="list-actions">
        <button mat-flat-button class="list-primary-action" (click)="router.navigate(['atron/departamentos/novo'])">
          <mat-icon>add</mat-icon>
          Novo departamento
        </button>
      </div>
    </header>

    <div class="list-toolbar">
      <mat-form-field class="list-filter" appearance="outline">
        <mat-label>Buscar departamento</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" #input>
      </mat-form-field>
    </div>

    <div class="list-table-wrap">
      <table class="list-table" mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
          <td mat-cell *matCellDef="let dep">{{ dep.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>
          <td mat-cell *matCellDef="let dep">{{ dep.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef aria-label="Ações"></th>
          <td mat-cell *matCellDef="let dep">
            <div class="list-row-actions">
              <button class="list-icon-action" mat-icon-button title="Editar departamento" (click)="editar(dep.codigo)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="list-icon-action-danger" mat-icon-button title="Excluir departamento" (click)="excluir(dep.codigo)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="list-no-data" [attr.colspan]="colunas.length">Nenhum departamento encontrado.</td>
        </tr>
      </table>
    </div>

    <mat-paginator class="list-paginator" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
      aria-label="Selecione as páginas dos departamentos">
    </mat-paginator>

    <footer class="list-footer-actions">
      <c-botao-voltar></c-botao-voltar>
    </footer>
  </section>
</main>
