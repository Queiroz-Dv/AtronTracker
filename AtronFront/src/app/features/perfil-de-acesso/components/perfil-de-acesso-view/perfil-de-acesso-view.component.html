<main class="list-page">
  <section class="list-panel" aria-labelledby="perfil-acesso-title">
    <header class="list-header">
      <div>
        <h1 id="perfil-acesso-title">Perfil de acesso</h1>
      </div>

      <div class="list-actions">
        <button mat-flat-button class="list-primary-action" (click)="router.navigate(['atron/perfil-de-acesso/novo'])">
          <mat-icon>add</mat-icon>
          Criar novo perfil
        </button>
      </div>
    </header>

    <div class="list-table-wrap list-table-wrap-spaced">
      <table class="list-table" mat-table [dataSource]="dataSource" matSort aria-label="Perfis de acesso">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Código do perfil</th>
          <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>
          <td mat-cell *matCellDef="let row">{{ row.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="quantidadeDeModulos">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantidade de módulos</th>
          <td mat-cell *matCellDef="let row">{{ row.quantidadeDeModulos }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef aria-label="Ações"></th>
          <td mat-cell *matCellDef="let row">
            <div class="list-row-actions">
              <button class="list-icon-action" mat-icon-button title="Editar perfil" (click)="editar(row.codigo)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="list-icon-action-danger" mat-icon-button title="Excluir perfil" (click)="excluir(row.codigo)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="list-no-data" [attr.colspan]="displayedColumns.length">Nenhum perfil de acesso encontrado.</td>
        </tr>
      </table>
    </div>

    <mat-paginator class="list-paginator" #paginator [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]" aria-label="Selecione a página de perfis de acesso">
    </mat-paginator>

    <footer class="list-footer-actions">
      <c-botao-voltar></c-botao-voltar>
    </footer>
  </section>
</main>
