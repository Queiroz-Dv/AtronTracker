<form [formGroup]="form" (ngSubmit)="salvar()" class="form-container usuario-configuracoes">
  <section class="settings-header">
    <p class="settings-eyebrow">Preferências do usuário</p>
    <h2>Configurações</h2>
    <p class="settings-description">Defina como deseja receber avisos relacionados ao seu trabalho na plataforma.</p>
  </section>

  <section class="settings-option">
    <mat-checkbox formControlName="receberNotificacaoTarefaPorEmail">
      Receber notificações de tarefas por e-mail
    </mat-checkbox>
    <p>Quando ativo, você recebe alertas por e-mail ao ser atribuído a uma tarefa.</p>
  </section>

  <mat-card-actions>
    <button mat-raised-button color="primary" type="submit" [disabled]="carregando">
      Salvar
    </button>
    <button mat-raised-button type="button" (click)="router.navigate(['atron/usuarios'])">
      Voltar
    </button>
  </mat-card-actions>
</form>
