<mat-sidenav-container class="sidenav-container">
  <mat-sidenav class="app-sidenav" mode="side" opened>
    <div class="side-brand">
      <span class="side-brand-icon">
        <mat-icon>hub</mat-icon>
      </span>
      <span>
        <strong>Atron Platform</strong>
        <small>Menu de módulos</small>
      </span>
    </div>

    <div class="side-actions">
      <button mat-stroked-button type="button" (click)="trocarVisualizacao()" title="Trocar para dashboard">
        <mat-icon>dashboard_customize</mat-icon>
        Dashboard
      </button>
      <button mat-stroked-button type="button" class="side-logout" (click)="logout()" title="Sair do sistema">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>

    <mat-nav-list class="module-nav-list">
      @for (item of modulosView; track $index) {
        <a mat-list-item (click)="navigate(item.route)">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.title }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <header class="app-content-topbar">
      <span>Atron Platform</span>
      <button mat-button type="button" (click)="trocarVisualizacao()">
        <mat-icon>dashboard_customize</mat-icon>
        Dashboard
      </button>
    </header>

    <div class="app-content-body">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
