<main class="dashboard-page">
  <header class="dashboard-header">
    <div>
      <p class="dashboard-kicker">Painel de gestão</p>
      <h1>Atron</h1>
    </div>

    <div class="dashboard-actions" aria-label="Ações do painel">
      <button class="header-action" type="button" (click)="trocarVisualizacao()" title="Trocar para menu">
        <mat-icon>menu</mat-icon>
        <span>Menu</span>
      </button>

      <button class="header-action header-action-danger" type="button" (click)="logout()" title="Sair do sistema">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </div>
  </header>

  <section class="dashboard-content" aria-labelledby="dashboard-title">
    <div class="dashboard-title-group">
      <h2 id="dashboard-title">Módulos do sistema</h2>
      <p>Acesse rapidamente as áreas disponíveis para sua rotina.</p>
    </div>

    @if(cardsView.length > 0) {
      <div class="module-grid">
        @for (card of cardsView; track card.code) {
          <button class="module-card" type="button" (click)="navigate(card.route)" [attr.aria-label]="'Acessar módulo ' + card.title">
            <span class="module-icon">
              <mat-icon>{{ card.icon }}</mat-icon>
            </span>

            <span class="module-info">
              <span class="module-title">{{ card.title }}</span>
              <span class="module-description">{{ card.description }}</span>
            </span>

            <span class="module-access">
              Acessar módulo
              <mat-icon>arrow_forward</mat-icon>
            </span>
          </button>
        }
      </div>
    } @else {
      <div class="dashboard-empty">
        <mat-icon>lock</mat-icon>
        <h3>Nenhum módulo disponível</h3>
        <p>Seu usuário ainda não possui módulos liberados para acesso.</p>
      </div>
    }
  </section>
</main>
