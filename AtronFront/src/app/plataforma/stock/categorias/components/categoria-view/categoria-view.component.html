<main class="list-page">
  <section class="list-panel" aria-labelledby="categorias-title">
    <header class="list-header">
      <div>
        <p class="list-eyebrow">Atron Stock</p>
        <h1 id="categorias-title">Categorias</h1>
        <p class="list-description">Organize os produtos por categorias e controle quais estão disponíveis.</p>
      </div>

      <div class="list-actions">
        <button mat-flat-button class="list-primary-action" (click)="router.navigate(['/atron/categorias/novo'])">
          <mat-icon>add</mat-icon>
          Nova categoria
        </button>
      </div>
    </header>

    <div class="list-toolbar">
      <mat-form-field class="list-filter" appearance="outline">
        <mat-label>Buscar categoria</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="filtrar($event)" />
      </mat-form-field>

      <button
        mat-stroked-button
        type="button"
        class="categoria-removed-filter"
        [class.categoria-removed-filter-active]="somenteRemovidas"
        [attr.aria-pressed]="somenteRemovidas"
        (click)="alternarFiltroRemovidas()">
        <mat-icon>{{ somenteRemovidas ? 'filter_alt_off' : 'delete_sweep' }}</mat-icon>
        {{ somenteRemovidas ? 'Exibindo removidas' : 'Exibir removidas' }}
      </button>
    </div>

    <div class="list-table-wrap">
      <table class="list-table" mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
          <td mat-cell *matCellDef="let categoria">{{ categoria.codigo }}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>
          <td mat-cell *matCellDef="let categoria">{{ categoria.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let categoria">
            <span class="categoria-status" [class.categoria-status-inativa]="!estaAtiva(categoria.status)">
              {{ descricaoStatus(categoria.status) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef aria-label="Ações"></th>
          <td mat-cell *matCellDef="let categoria">
            <div class="list-row-actions" (dblclick)="$event.stopPropagation()">
              <button
                class="list-icon-action"
                mat-icon-button
                title="Editar categoria"
                [disabled]="estaRemovida(categoria.status)"
                (click)="editar(categoria.codigo)">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                class="categoria-status-action"
                mat-icon-button
                [title]="estaAtiva(categoria.status) ? 'Inativar categoria' : 'Ativar categoria'"
                [disabled]="estaRemovida(categoria.status)"
                (click)="alterarStatus(categoria)">
                <mat-icon>{{ estaAtiva(categoria.status) ? 'toggle_on' : 'toggle_off' }}</mat-icon>
              </button>
              <button
                class="list-icon-action"
                mat-icon-button
                title="Ver histórico da categoria"
                (click)="abrirHistorico(categoria)">
                <mat-icon>history</mat-icon>
              </button>
              <button
                class="list-icon-action-danger"
                mat-icon-button
                title="Excluir categoria"
                [disabled]="estaRemovida(categoria.status)"
                (click)="excluir(categoria)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr
          mat-row
          class="categoria-row"
          *matRowDef="let row; columns: colunas"
          title="Dê um duplo clique para ver o histórico"
          (dblclick)="abrirHistorico(row)">
        </tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="list-no-data" [attr.colspan]="colunas.length">Nenhuma categoria encontrada.</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      class="list-paginator"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Selecione as páginas das categorias">
    </mat-paginator>

    <footer class="list-footer-actions">
      <c-botao-voltar></c-botao-voltar>
    </footer>
  </section>
</main>
