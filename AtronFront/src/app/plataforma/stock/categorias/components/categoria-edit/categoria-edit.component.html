<form [formGroup]="form" (ngSubmit)="salvar()" class="form-container">
  <c-categoria-form [form]="form" [editando]="!!codigo"></c-categoria-form>

  <mat-card-actions>
    <button mat-flat-button type="submit" [disabled]="form.invalid || salvando">
      <mat-icon>{{ salvando ? 'hourglass_top' : 'save' }}</mat-icon>
      {{ salvando ? 'Salvando...' : 'Salvar' }}
    </button>
    <button mat-stroked-button type="button" (click)="voltar()">Cancelar</button>
  </mat-card-actions>
</form>
