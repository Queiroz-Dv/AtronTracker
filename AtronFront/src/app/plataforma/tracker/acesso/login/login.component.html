<main class="auth-page">
  <section class="auth-shell" aria-labelledby="login-title">
    <div class="auth-brand">
      <span class="brand-mark">
        <mat-icon>hub</mat-icon>
      </span>
      <p class="brand-kicker">Painel de gestão</p>
      <h1 id="login-title">Acesse o Atron</h1>
      <p class="brand-copy">
        Entre para gerenciar módulos, usuários e rotinas da sua empresa com segurança.
      </p>
    </div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Login</h2>
        <p>Informe seus dados para continuar.</p>
      </div>

      <form [formGroup]="form" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Código de usuário</mat-label>
          <mat-icon matPrefix>person_outline</mat-icon>
          <input matInput formControlName="codigo" placeholder="Digite seu código" autocomplete="username" />
          <c-control-error [control]="form.get('codigo')"></c-control-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <mat-icon matPrefix>lock_outline</mat-icon>
          <input matInput [type]="passwordType" formControlName="senha" placeholder="Digite sua senha" autocomplete="current-password" />
          <button class="password-toggle" mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" aria-label="Alternar visibilidade da senha">
            <mat-icon>{{ passwordType === 'password' ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <c-control-error [control]="form.get('senha')"></c-control-error>
        </mat-form-field>

        <button mat-flat-button type="submit" class="primary-action" (click)="autenticar()">
          <mat-icon>login</mat-icon>
          Entrar
        </button>

        <div class="auth-link-actions">
          <button mat-button type="button" class="text-action" (click)="esqueciSenha()">
            Esqueci minha senha
          </button>

          <button mat-button type="button" class="text-action" (click)="reenviarConfirmacao()">
            Reenviar confirmação
          </button>
        </div>

        <div class="auth-divider">
          <span></span>
          <small>ou</small>
          <span></span>
        </div>

        <button mat-stroked-button type="button" class="secondary-action" (click)="registrar()">
          <mat-icon>person_add</mat-icon>
          Criar nova conta
        </button>
      </form>
    </div>

    <p class="auth-footer">© 2026 Atron. Todos os direitos reservados.</p>
  </section>
</main>
