<section class="usuario-info-card">
  <header class="usuario-info-header">
    <span class="usuario-info-icon" aria-hidden="true">
      <mat-icon>badge</mat-icon>
    </span>

    <div>
      <p class="usuario-info-eyebrow">Usuário responsável</p>
      <h3>Informações do usuário</h3>
    </div>
  </header>

  <div class="usuario-info-grid">
    <article class="usuario-info-item usuario-info-item-principal">
      <span>Nome</span>
      <strong>{{ nome || 'Não informado' }}</strong>
    </article>

    <article class="usuario-info-item">
      <span>Cargo</span>
      <strong>{{ cargoDescricao || 'Não informado' }}</strong>
    </article>

    <article class="usuario-info-item">
      <span>Departamento</span>
      <strong>{{ departamentoDescricao || 'Não informado' }}</strong>
    </article>
  </div>
</section>
